disabled_rules:
  - file_length
  - line_length
  - redundant_void_return
  - todo
  - type_body_length

included:
  - Sources
  - Tests

identifier_name:
  min_length: 1
  max_length: 50
inclusive_language:
  override_allowed_terms: ["masterkey"]
type_name:
  max_length: 50
  allowed_symbols: "_"

custom_rules:
  # Every non-private method of a provider or decorator named like a CloudProvider requirement is taken as its witness.
  concurrent_cloud_provider_witness:
    name: "@concurrent CloudProvider witness"
    message: "Mark every CloudProvider method of a provider or decorator @concurrent; the compiler doesn't flag a witness that omits it."
    included: "Sources/.*(CloudProvider|ProviderDecorator|LocalFileSystemProvider)\\.swift"
    excluded: "Sources/CryptomatorCloudAccessCore/API/CloudProvider\\.swift"
    regex: '^(?<!@concurrent\n)\t(?:(?:public|package|internal|override|final|nonisolated) )*func (?:fetchItemMetadata|fetchItemList|downloadFile|uploadFile|createFolder|deleteFile|deleteFolder|moveFile|moveFolder)\('
    severity: error
  # Covers Tests/ only until WebDAVClient.swift's appendingPathComponent("/") is settled. A heuristic: it tells URL calls from CloudPath.appendingPathComponent(_:) by the isDirectory: label or a receiver named …URL or temporaryDirectory.
  url_appending_path_component:
    name: "URL appendingPathComponent"
    message: "Use appending(component:directoryHint:) or appending(path:directoryHint:) instead of the soft-deprecated appendingPathComponent."
    included: "Tests/.*\\.swift"
    regex: '(URL|temporaryDirectory)\s*\.appendingPathComponent\(|appendingPathComponent\((?:[^()]|\([^()]*\))*isDirectory:'
    severity: error
